[project]
name = "openrelik-dev"
version = "0.1.0"
description = "Developer CLI for the OpenRelik monorepo (./devctl)"
requires-python = ">=3.12"
dependencies = ["click>=8.1.7,<9.0.0"]

[project.scripts]
devctl = "devctl.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.2,<10.0.0", "pytest-cov>=6.0.0,<7.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
