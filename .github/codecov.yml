# Codecov settings. The Python Unit Tests and Frontend Unit Tests workflows
# upload the coverage, one flag per project (its path, with "-" for "/", e.g.
# server, workers-strings, libs-common, web-sunstone).

# A pull request tests only the projects it changes; the others keep their
# last result, so the totals cover every project.
flag_management:
  default_rules:
    carryforward: true

# Totals per area, shown in pull request comments and on codecov.io.
component_management:
  individual_components:
    - component_id: server
      name: server
      paths: ["server/**"]
    - component_id: workers
      name: workers
      paths: ["workers/**"]
    - component_id: libs
      name: libs
      paths: ["libs/**"]
    - component_id: web-sunstone
      name: web/sunstone
      paths: ["web/sunstone/**"]
    - component_id: web-runestone
      name: web/runestone
      paths: ["web/runestone/**"]

# The coverage checks on pull requests are informational: they report, but
# never block a merge.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, components, condensed_files"
  require_changes: true
