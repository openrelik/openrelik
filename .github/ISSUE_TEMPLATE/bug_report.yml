name: Bug report
description: Report broken behavior in OpenRelik.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real forensic evidence, case details, or credentials. Redact sensitive paths and data from logs and screenshots.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of OpenRelik is affected?
      multiple: true
      options:
        - server (API, mediator, metrics, migrations)
        - web/runestone (default web UI)
        - web/sunstone (legacy web UI)
        - workers
        - mcp (MCP server)
        - libs (common, ai-common, python-client, worker-common)
        - deploy
        - Other / not sure
    validations:
      required: true

  - type: input
    id: worker_or_lib
    attributes:
      label: Worker or library name
      description: If the bug is in a specific worker or library, name it here.
      placeholder: e.g. workers/plaso, workers/timesketch, libs/python-client

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Upload or select ...
        2. Run workflow / open ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version and environment
      description: OpenRelik version (or git commit), deployment method (Docker Compose, devctl), OS, and browser if UI-related.
      placeholder: e.g. v0.18.0, Docker Compose on Ubuntu 24.04, Chrome 131
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or tracebacks
      description: Paste container logs, stack traces, or API error responses.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, synthetic sample input, or anything else that helps reproduce the issue.
