name: Feature request
description: Suggest a new feature, worker, or improvement.
labels: ["Feature Request"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of OpenRelik does this apply to?
      multiple: true
      options:
        - server (API, mediator, metrics, migrations)
        - web/runestone (default web UI)
        - web/sunstone (legacy web UI)
        - workers (existing worker)
        - New worker
        - mcp (MCP server)
        - libs (common, ai-common, python-client, worker-common)
        - deploy
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and for whom? What happens today without it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe what you want OpenRelik to do.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Workarounds you have tried, mockups, links to tools or formats, or open questions.
