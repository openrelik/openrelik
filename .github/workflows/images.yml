# Builds and pushes the Docker images listed in .github/images.toml.
#
# - pull request merged into main: the images whose context changed, tagged
#   `latest` and with the short commit ID. A direct push to main (not from a
#   merged pull request) builds nothing. The push event is used rather than
#   the pull request's "closed" event, whose token can't push packages for pull
#   requests from forks.
# - release tag (made by dev/release.py): v0.18.0 builds the platform images,
#   mcp-v0.18.0 the MCP server, worker-<name>-v0.18.0 that worker. They're
#   tagged 0.18.0 and the floating minor tag 0.18 (unless a newer 0.18.x of that
#   component is released already); `latest` isn't moved.
# - Run workflow (workflow_dispatch): all images, or the ones named.
# - pull requests: only checks that every Dockerfile is listed in .github/images.toml.
#
# GitHub starts no workflow for tags pushed more than three at a time, so push
# release tags in groups of at most three (dev/release.py prints the commands).
name: Build Docker Images

on:
  push:
    branches: [main]
    tags: ["v*", "mcp-v*", "worker-*-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      images:
        description: 'Images to build: "all", or names separated by spaces (e.g. openrelik-server openrelik-worker-strings)'
        required: true
        default: all

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: Select images
    runs-on: ubuntu-24.04
    permissions:
      contents: read       # check out the repository
      pull-requests: read  # find the merged pull request of a push
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that every Dockerfile is listed
        run: python3 .github/scripts/images.py check

      - name: Select the images to build
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REQUESTED: ${{ inputs.images }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT" == push && "$REF_TYPE" == tag ]]; then
            matrix="$(python3 .github/scripts/images.py matrix --registry "$REGISTRY" --tag "$REF_NAME")"
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "$matrix" | python3 -c 'import json, sys; [print(r["label"]) for r in json.load(sys.stdin)]'
            exit 0
          fi
          case "$EVENT" in
            pull_request)
              echo "matrix=[]" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            push)
              merged="$(gh api "repos/$REPOSITORY/commits/$SHA/pulls" \
                --jq '[.[] | select(.merged_at != null and .base.ref == "main") | .number] | first // empty')"
              if [[ -z "$merged" ]]; then
                echo "::notice::$SHA is not from a merged pull request; no images are built."
                echo "matrix=[]" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Merged pull request: #$merged"
              if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                which=(--all)
              else
                git diff --name-only "$BEFORE" "$SHA" > "$RUNNER_TEMP/changed.txt"
                which=(--changed "$RUNNER_TEMP/changed.txt")
              fi
              ;;
            workflow_dispatch)
              if [[ "$REQUESTED" == all ]]; then
                which=(--all)
              else
                which=()
                for name in $REQUESTED; do which+=(--only "$name"); done
              fi
              ;;
          esac
          matrix="$(python3 .github/scripts/images.py matrix --registry "$REGISTRY" --sha "${SHA::7}" "${which[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | python3 -c 'import json, sys; [print(r["label"]) for r in json.load(sys.stdin)]'

  build:
    needs: select
    if: needs.select.outputs.matrix != '[]'
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read      # check out the repository
      packages: write     # push the image to ghcr.io
      attestations: write # store the build provenance attestation
      id-token: write     # sign the attestation (Sigstore)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ matrix.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.name }}

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
